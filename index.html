<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luca Todisco</title>
    <style>
        /* Reset e layout di base */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center; /* Centra tutto verticalmente */
            justify-content: center; /* Centra tutto orizzontalmente */
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%); /* Sfondo morbido a gradiente */
            color: #2d3748;
        }

        /* Contenitore principale */
        .container {
            width: 100%;
            max-width: 900px;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* Intestazione */
        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .title-row {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 10px;
        }

        .site-logo {
            width: 56px;
            height: 56px;
            object-fit: contain;
            border-radius: 12px;
        }

        .header h1 {
            font-size: 46px;
            margin: 0;
            color: #1a202c;
            letter-spacing: -1px;
        }

        .header p {
            font-size: 22px;
            margin: 0;
            color: #718096;
            font-weight: 300;
        }

        /* Contenitore dei bottoni */
        .button-container {
            display: flex;
            gap: 30px; /* Spazio esatto e uniforme tra i bottoni */
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Stile dei bottoni */
        .btn {
            flex: 1; /* Costringe i bottoni sulla stessa riga ad avere la stessa larghezza */
            min-width: 240px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 20px;
            text-decoration: none;
            color: white;
            border-radius: 16px; /* Angoli più morbidi e moderni */
            box-shadow: 0 10px 20px rgba(0, 123, 255, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
            min-height: 130px; /* Garantisce la stessa altezza */
            box-sizing: border-box;
        }

        /* Effetto sollevamento al passaggio del mouse */
        .btn:hover {
            transform: translateY(-5px); 
            box-shadow: 0 15px 25px rgba(0, 123, 255, 0.25);
        }

        /* Colori bottoni a gradiente */
        .btn-supercell {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
        }

        .btn-pes {
            background: linear-gradient(135deg, #006ee6 0%, #004494 100%);
        }

        /* Stile bottone Black Friday su riga indipendente e in evidenza */
        .btn-blackfriday {
            flex: 0 0 100%;
            width: 100%;
            min-height: 145px;
            padding: 28px 24px;
            background: linear-gradient(135deg, #2d3748 0%, #0a0a0a 100%);
            color: #ffffff;
            border: 1px solid #1a202c;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.22);
        }

        .btn-blackfriday:hover {
            box-shadow: 0 18px 30px rgba(0, 0, 0, 0.34);
        }

        .btn-blackfriday .btn-title {
            font-size: 25px;
        }

        .btn-blackfriday .btn-subtitle {
            font-size: 16px;
        }

        /* Tipografia interna ai bottoni */
        .btn-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .btn-subtitle {
            font-size: 15px;
            font-weight: normal;
            opacity: 0.9;
        }

        /* Responsive per smartphone */
        @media (max-width: 600px) {
            .button-container {
                flex-direction: column;
            }
            .btn-blackfriday {
                flex: 1 1 auto;
                min-height: 130px;
                padding: 25px 20px;
            }
            .btn-blackfriday .btn-title {
                font-size: 22px;
            }
            .site-logo {
                width: 42px;
                height: 42px;
            }
            .header h1 {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Intestazione -->
        <div class="header">
            <div class="title-row">
                <img src="./img/general/LogoFinal.png" alt="Logo Luca Todisco" class="site-logo">
                <h1>Luca Todisco</h1>
            </div>
            <p>I Miei Progetti</p>
        </div>

        <!-- Contenitore dei bottoni -->
        <div class="button-container">
            
            <!-- Bottone 1: Supercell -->
            <a href="ContentCreator.html" class="btn btn-supercell">
                <span class="btn-title">Content Creator</span>
                <span class="btn-subtitle">Trusted Creator Supercell</span>
            </a>

            <!-- Bottone 2: LT PES League ITA -->
            <a href="./campionatopes/html/seriea-stagione2.html" class="btn btn-pes">
                <span class="btn-title">LT PES League ITA</span>
            </a>

            <!-- Bottone 3: Offerte Black Friday su riga dedicata -->
            <a href="./blackfriday.html" class="btn btn-blackfriday">
                <span class="btn-title">Black Friday 2026</span>
                <span class="btn-subtitle">QR CODE da scansionare</span>
            </a>
            
        </div>
    </div>

</body>
</html>
